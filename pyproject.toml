[project]
name = "intervideo-pipeline"
version = "0.1.0"
description = "InterVideo CV/JD processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-cloud>=2.13.0",
    "markdown>=3.10.3",
    "python-dotenv>=1.2.2",
    "openai>=1.52.0",
    "instructor>=1.3.3",
    "pydantic>=2.7.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "langchain-openai>=0.1.0",
    "tavily-python>=0.3.16",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.2",
    "httpx>=0.26.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "datasette>=0.65.3",
    "sqlite-web>=0.8.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --tb=short -s"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
